name: scene_studio
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  video_player: ^2.14.1
  video_player_win: ^3.3.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  windows_file_picker: ^2.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/branding/
    - assets/scene/
  fonts:
    - family: TikTokSans
      fonts:
        - asset: assets/fonts/TikTokSans.ttf
    - family: TikTokIcons
      fonts:
        - asset: assets/fonts/TikTokIcons.ttf
    - family: SceneShareBrands
      fonts:
        - asset: assets/fonts/SceneShareBrands.ttf
